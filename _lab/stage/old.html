<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지급액 — 기존 (test-onyeol)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* ── test-onyeol 원본 스타일 그대로 (비교 공정성 위해 손대지 않음) ── */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--navy:#12305C;--ink:#16181d;--sub:#6b7280;--line:#e8eaee;--warm:#EA580C;--cool:#2563EB}
  html,body{height:100%}
  body{font-family:Pretendard,sans-serif;color:var(--ink);background:#fff;overflow:hidden}

  .compliance{position:fixed;top:0;left:0;right:0;z-index:60;background:#f4f5f7;color:#6b7280;
    font-size:9.5px;line-height:1.35;padding:5px 10px;text-align:center;letter-spacing:-.2px}
  .footbar{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;padding:7px 14px;font-size:11px;color:#9aa1ac}

  .stage{position:absolute;top:44px;bottom:104px;left:0;right:0}
  .pg{position:absolute;inset:0;padding:14px 24px;display:flex;flex-direction:column;justify-content:center}

  .cue{opacity:0;transform:translateY(16px);transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1)}
  .cue.show{opacity:1;transform:none}
  .cue.zoom{transform:scale(.86)}
  .cue.zoom.show{transform:scale(1)}

  .qh{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:18px;letter-spacing:-.3px}

  .duo{display:flex;gap:14px;margin-top:22px}
  .card{flex:1;border-radius:20px;padding:20px 12px;text-align:center;color:#fff}
  .card.w{background:linear-gradient(160deg,#F97316,#C2410C)}
  .card.c{background:linear-gradient(160deg,#3B82F6,#1D4ED8)}
  .card .ic{font-size:40px;line-height:1}
  .card .nm{margin-top:9px;font-size:18px;font-weight:700;opacity:.95}
  .card .vl{margin-top:7px;font-size:31px;font-weight:800;letter-spacing:-1.2px;font-variant-numeric:tabular-nums}

  .cmp{margin-top:22px;background:#f6f7f9;border-radius:16px;padding:17px;font-size:18px;line-height:1.6}
  .cmp b{color:var(--navy)}

  .caption{position:fixed;left:0;right:0;bottom:30px;z-index:56;background:rgba(12,18,30,.92);
    color:#fff;min-height:62px;display:flex;align-items:center;justify-content:center;
    padding:12px 118px 12px 18px;font-size:17px;line-height:1.5;letter-spacing:-.3px;text-align:center}
  .caption span{opacity:0;transition:opacity .25s}
  .caption span.on{opacity:1}

  .replay{position:fixed;right:16px;bottom:52px;z-index:58;
    width:44px;height:44px;border-radius:50%;border:0;background:var(--navy);color:#fff;
    font-size:17px;font-family:inherit;cursor:pointer;
    box-shadow:0 5px 16px rgba(18,48,92,.4);display:grid;place-items:center}
  .replay:active{transform:scale(.92)}
</style>

<div class="compliance">본 자료는 교육용으로 온라인 매체(SNS등) 및 고객 설명, 광고자료로 활용 행위는 법으로 금지됩니다.</div>

<div class="stage">
  <section class="pg">
    <div class="qh cue" data-t="0">얼마가 나오나</div>
    <div class="duo">
      <div class="card w cue zoom" data-t="0">
        <div class="ic">🌡️</div><div class="nm">온열질환</div>
        <div class="vl" data-count="20" data-ct="1.94">0만</div>
      </div>
      <div class="card c cue zoom" data-t="3.68">
        <div class="ic">🥶</div><div class="nm">저체온증</div>
        <div class="vl" data-count="10" data-ct="5.18">0만</div>
      </div>
    </div>
    <div class="cmp cue" data-t="6.86">진단을 받으면 지급됩니다.<br><b>각 연간 1회한</b></div>
  </section>
</div>

<div class="caption"><span id="capTx"></span></div>
<button class="replay" onclick="play()">↻</button>
<div class="footbar"><span>영업컨설팅파트 2608 - 01</span><span>모집인 / 교육용</span></div>

<audio id="au" preload="auto" src="../../web-edu/test-onyeol/audio/p3.mp3"></audio>

<script>
const SUBS=[{t:0,e:8.42,x:"온열질환으로 진단받으면 20만원, 저체온증으로 진단받으면 10만원. 각각 연간 1회한입니다."}];
const au=document.getElementById('au'), cap=document.getElementById('capTx');
let raf=null, t0=0;
const clock=()=>au.paused?(performance.now()-t0)/1000:au.currentTime;

/* 카운트 엔진만 새 판과 동일하게 시계 종속으로 교체 (디자인은 원본 그대로 — 비교 공정성) */
function countAt(el,now){
  const ct=parseFloat(el.dataset.ct), to=+el.dataset.count;
  if(now<ct){el.textContent='0만';return}
  const p=Math.min((now-ct)/0.7,1);
  el.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString('ko-KR')+'만';
}
function reset(){
  document.querySelectorAll('.cue').forEach(el=>el.classList.remove('show'));
  document.querySelectorAll('[data-count]').forEach(el=>{el.textContent='0만';el._done=false});
  cap.textContent=''; cap.classList.remove('on');
}
function loop(){
  const now=clock();
  document.querySelectorAll('.cue').forEach(el=>{
    if(now>=parseFloat(el.dataset.t))el.classList.add('show');
  });
  document.querySelectorAll('[data-ct]').forEach(el=>countAt(el,now));
  const s=SUBS.find(s=>now>=s.t&&now<=s.e+.35);
  const tx=s?s.x:'';
  if(cap.textContent!==tx){cap.classList.remove('on');
    setTimeout(()=>{cap.textContent=tx;cap.classList.add('on')},120);}
  raf=requestAnimationFrame(loop);
}
function play(){
  cancelAnimationFrame(raf); reset();
  t0=performance.now();
  au.currentTime=0; au.play().catch(()=>{});
  raf=requestAnimationFrame(loop);
}
play();
</script>
